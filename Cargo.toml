[package]
name = "hnl-engine-exec-bytecode"
version = "0.1.0"
edition = "2024"
description = "The bytecode eval engine for the eval operation (ADR-0044 §4, §7)."
license = "MIT"
repository = "https://github.com/handl-lang/engine-exec-bytecode"
homepage = "https://handl-lang.github.io/docs/engine-exec-bytecode/"
documentation = "https://handl-lang.github.io/docs/engine-exec-bytecode/reference/"
readme = "README.md"
keywords = ["handl", "engine", "eval", "bytecode", "vm"]
categories = ["development-tools", "compilers"]
# Git-install only: https://github.com/handl-lang/engine-exec-bytecode (no crates.io).
publish = false

[dependencies]
handl-language = { git = "https://github.com/handl-lang/kernel", branch = "main" }
handl-platform = { git = "https://github.com/handl-lang/host", branch = "main" }
hnl-engine = { git = "https://github.com/handl-lang/engine", branch = "main" }
hnl-engine-exec = { git = "https://github.com/handl-lang/engine-exec", branch = "main" }
hnl-engine-exec-tree-walk = { git = "https://github.com/handl-lang/engine-exec-tree-walk", branch = "main" }
hnl-engine-transform = { git = "https://github.com/handl-lang/engine-transform", branch = "main" }
hnl-engine-transform-rewrite = { git = "https://github.com/handl-lang/engine-transform-rewrite", branch = "main" }
handl-runtime = { git = "https://github.com/handl-lang/host", branch = "main" }
handl-value = { git = "https://github.com/handl-lang/kernel", branch = "main" }
serde_json = "1"
rustc-hash = "2"
stacker = "0.1"

[dev-dependencies]
handl-test-utils = { git = "https://github.com/handl-lang/host", branch = "main" }
handl-plugin-module = { git = "https://github.com/handl-lang/host", branch = "main" }
serde_json = "1"
